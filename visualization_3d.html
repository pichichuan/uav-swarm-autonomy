<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>三维多无人机协同演示</title>
<style>body{margin:0;background:#0b1320;color:#e7f0fa;font:16px system-ui;display:grid;place-items:center;height:100vh}canvas{background:linear-gradient(#10243a,#1f3d50);border:1px solid #456078;border-radius:12px;box-shadow:0 20px 55px #0009}.info{position:fixed;top:20px;left:24px;line-height:1.65}.title{font-size:23px;font-weight:700}</style>
<body><div class="info"><div class="title">三维多无人机：建图 · 识别 · 避障 · 协同</div><span style="color:#31d4c4">● UAV-1</span>　<span style="color:#c996ff">● UAV-2</span>　<span style="color:#ef674e">■ 静态立柱</span>　<span style="color:#4b9dff">● 动态行人</span><br><span id="status">A* 三维任务跟踪</span></div><canvas id="c" width="1180" height="760"></canvas>
<script>
const c=document.querySelector('#c'),g=c.getContext('2d'),st=document.querySelector('#status');let t=0;
const D=[{id:'UAV-1',x:0,y:-1.5,z:1.25,vx:0,vy:0,g:[7,-1.45],col:'#31d4c4',done:false},{id:'UAV-2',x:0,y:1.5,z:1.65,vx:0,vy:0,g:[7,1.45],col:'#c996ff',done:false}];const fixed=[{x:3.2,y:0,r:.72,h:2.6},{x:5.55,y:1.85,r:.45,h:2.2}];
function P(x,y,z=0){return [150+x*115+y*42,585-y*35-z*105-x*13]};function poly(a,col){g.fillStyle=col;g.beginPath();a.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fill()}function line(a,b,col,w=1){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}
function cyl(o,col){let b=P(o.x,o.y,0),top=P(o.x,o.y,o.h),rx=o.r*112,ry=o.r*37;g.fillStyle=col+'aa';g.beginPath();g.ellipse(...top,rx,ry,0,0,7);g.fill();poly([[top[0]-rx,top[1]],[b[0]-rx,b[1]],[b[0]+rx,b[1]],[top[0]+rx,top[1]]],col+'bb');g.fillStyle='#ffffff33';g.beginPath();g.ellipse(...top,rx,ry,0,0,7);g.fill()}
function drone(d){let p=P(d.x,d.y,d.z),s=18;poly([[p[0],p[1]-s],[p[0]+s,p[1]],[p[0],p[1]+s],[p[0]-s,p[1]]],d.col);line([p[0]-30,p[1]],[p[0]+30,p[1]],'#dcecff',2);line([p[0],p[1]-24],[p[0],p[1]+24],'#dcecff',2);g.fillStyle='#0b1320';g.fillText('▲',p[0]-5,p[1]+5);g.fillStyle='white';g.fillText(d.id,p[0]-25,p[1]-34);line(P(d.x,d.y,0),p,d.col+'77',1)}
function move(){t+=.025;let phase=(t*.72)%7.2,person={x:4.6,y:-2.4+(phase<=3.6?phase:7.2-phase),r:.3,h:1.55,vy:phase<=3.6?.72:-.72};let avoid=false;
D.forEach((d,i)=>{if(d.done)return;let dx=d.g[0]-d.x,dy=d.g[1]-d.y,L=Math.hypot(dx,dy);if(L<.24){d.done=true;d.vx=d.vy=0;return}let vx=1.35*dx/L,vy=1.35*dy/L;[...fixed,person].forEach(o=>{let ox=o.x+(o===person?o.vy*1.2:0),rx=d.x-ox,ry=d.y-o.y,R=Math.hypot(rx,ry),B=1.15+o.r;if(R<B){let k=1.8*(B-R)/B;vx+=k*rx/R;vy+=k*ry/R;if(o===person)avoid=true}});let q=D[1-i],rx=d.x-q.x,ry=d.y-q.y,R=Math.hypot(rx,ry);if(R<1){vx+=1.6*(1-R)*rx/R;vy+=1.6*(1-R)*ry/R}let V=Math.hypot(vx,vy);if(V>1.5){vx*=1.5/V;vy*=1.5/V}d.vx+=(vx-d.vx)*.12;d.vy+=(vy-d.vy)*.12;d.x+=d.vx*.025;d.y+=d.vy*.025});draw(person,avoid);requestAnimationFrame(move)}
function draw(person,avoid){g.clearRect(0,0,c.width,c.height);for(let x=0;x<=8;x++)line(P(x,-3),P(x,3),'#7894a422');for(let y=-3;y<=3;y++)line(P(0,y),P(8,y),'#7894a422');fixed.forEach(o=>cyl(o,'#ef674e'));cyl(person,'#4b9dff');let q=P(person.x,person.y,person.h+.2);g.fillStyle='white';g.fillText('动态识别行人',q[0]-38,q[1]-10);D.forEach(d=>{let a=P(d.x,d.y,d.z),b=P(d.g[0],d.g[1],d.z);line(a,b,d.col+'88',2);let gp=P(d.g[0],d.g[1],0);g.strokeStyle='#74ed91';g.lineWidth=2;g.beginPath();g.arc(...gp,12,0,7);g.stroke();drone(d)});st.textContent=avoid?'动态目标预测避让：激活（速度平滑）':'A* 三维任务跟踪：正常';}
move();
</script></body></html>
